[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-neuro"
version = "0.1.0"
description = "Domain-informed KG pruning for GNN neurological drug repurposing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.1",
  "polars>=1.0",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]
[project.optional-dependencies]
# optimuskg requires Python >=3.12; optional if local parquet paths are set.
optimuskg = ["optimuskg>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]