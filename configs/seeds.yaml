# Seed set for neurodegenerative / neuroinflammation-guided pruning.
# BPO IDs follow the slide; disease roots expand to ~79 descendant DIS nodes.

bpo_ids:
  - GO_0150076  # neuroinflammatory response
  - GO_0061900  # glial cell activation
  - GO_0150103  # reactive gliosis
  - GO_0001774  # microglial cell activation
  - GO_0048143  # astrocyte activation
  - GO_0150077  # regulation of neuroinflammatory response

# Do not union extra terms — use only the 6 BPO ids above.
extra_term_csv: null

# 10 neurodegenerative disease roots (descendants resolved via DIS-DIS PARENT).
disease_root_ids:
  - MONDO_0004975  # Alzheimer disease
  - MONDO_0005180  # Parkinson disease
  - MONDO_0004976  # amyotrophic lateral sclerosis
  - MONDO_0007739  # Huntington disease
  - MONDO_0005301  # multiple sclerosis
  - MONDO_0017276  # frontotemporal dementia
  - EFO_1001050    # multiple system atrophy
  - EFO_0006792    # Lewy body dementia
  - MONDO_0019037  # progressive supranuclear palsy
  - MONDO_0018926  # human prion disease

# Precomputed descendant expansion (optional cache).
disease_descendants_csv: data/seeds/seed_diseases_neurodeg.csv

# Optional explicit gene seeds (otherwise derived from BPO-GEN edges).
gene_seed_csv: data/seeds/seed_nodes_core.csv

prune:
  # Paper-table setting: BPO+gene+disease, k=1 (override after comparison if needed).
  k: 1
  # Restrict traversal types so ANA expression edges do not explode the subgraph.
  # This matches the pruning-comparison regime (~10-50% nodes).
  type_allow:
    - GEN
    - DRG
    - DIS
    - BPO
    - PWY
  # Always keep these edge labels if both endpoints survive.
  keep_relations:
    - INDICATION
    - CONTRAINDICATION
    - OFF_LABEL_USE
